name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Placeholder embedded assets
        run: python3 -c "import zipfile; zipfile.ZipFile('application/statics/assets.zip','w').writestr('assets/build/.keep','')"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile --network-timeout 1000000
      - run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # cloudreve-api is the portable crate; the full workspace is Windows-only
  # until Phase D lands (cfapi/shellext/win32_notif).
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p cloudreve-api
      - if: runner.os == 'Windows'
        run: cargo check --workspace
