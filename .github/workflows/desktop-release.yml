name: Desktop Release

# Tag `desktop-v*` builds and publishes the Tauri desktop app for
# Windows, macOS and Linux. Server releases stay on the `v*` tags
# handled by release.yml (goreleaser).
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: desktop/ui/yarn.lock

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev patchelf libfuse2 fuse3

      - name: Install UI dependencies
        working-directory: desktop/ui
        run: yarn install --frozen-lockfile

      # tauri-action runs `tauri build` (which triggers beforeBuildCommand ->
      # the UI build), produces the platform bundles and attaches them to the
      # GitHub release for the pushed tag:
      #   Windows -> .msi + .exe (NSIS), macOS -> .dmg + .app.tar.gz,
      #   Linux -> .deb + .AppImage
      # MSIX requires separate packaging + store signing; not covered here.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # With the signing key set, tauri-action signs updater artifacts and
          # publishes latest.json on the release — the in-app updater feed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Cloudreve Desktop ${{ github.ref_name }}'
          releaseBody: 'Cloudreve Desktop for Linux, macOS, and Windows.'
          releaseDraft: false
          prerelease: false
